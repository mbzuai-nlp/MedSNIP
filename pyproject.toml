[project]
name = "medsnip"
version = "0.1.0"
description = "Building and Benchmarking Snippet-Level Granularity for Medical Fact Verification"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "openai",
    "python-dotenv",
    "httpx",
    "requests",
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "sentence-transformers",
    "rouge-score",
    "tiktoken",
    "anthropic>=0.102.0",
    "datasets>=4.8.5",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
