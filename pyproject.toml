[project]
name = "medsnip"
version = "0.1.0"
description = "Context-aware fact verification for medical open-domain QA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai",
    "python-dotenv",
    "httpx",
    "requests",
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "sentence-transformers",
    "rouge-score",
    "tiktoken",
    "anthropic>=0.102.0",
    "datasets>=4.8.5",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
